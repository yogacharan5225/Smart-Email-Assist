spring.application.name=email-writer-sb
server.port=${PORT:8080}
spring.config.import=optional:file:.env[.properties]

# Gemini Developer API
spring.ai.google.genai.api-key=${GEMINI_API_KEY:${GEMINI_KEY:}}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-2.5-flash}
spring.ai.google.genai.chat.temperature=${GEMINI_TEMPERATURE:0.4}

# Browser clients can call the API during local development.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
