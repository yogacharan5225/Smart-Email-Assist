spring.application.name=email-writer-sb
server.port=${PORT:8080}
spring.config.import=optional:file:.env[.properties]

# AI service credentials
spring.ai.google.genai.api-key=${GEMINI_API_KEY:${GEMINI_KEY:}}

# CORS: comma-separated list of allowed origins, e.g.
# CORS_ALLOWED_ORIGINS=http://localhost:5173,chrome-extension://<your-extension-id>
# Defaults to "*" so the React dev server and the Chrome extension both work
# out of the box (no cookies/credentials are used, so a wildcard is safe here).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
